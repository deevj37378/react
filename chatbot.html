<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>
    <script src="react-basics.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        function ChatInput() {
          return (
            <>
              <input placeholder="Send a message to ChatBot" size="30" />
              <button>Send</button>
            </>
          );
        }

        function ChatMessage(props) {
          const { message, sender } = props;

          return (
            <div>
              {sender === "user" && <img src="user-pic.png" width="50" />}
              {message}
              {sender === "robot" && <img src="robot-pic.png" width="50" />}
            </div>
          );
        }

        function ChatMessages() {
          const array = React.useState([
            { message: "Hello chatbot", sender: "user" },
            { message: "Hello! How can I help you?", sender: "robot" },
            { message: "today's date", sender: "user" },
            { message: "Today is October 11", sender: "robot" }
          ])
          const chatMessages = array[0]
     
          function sendMessage() {
            chatMessages.push({
              message: "test",
              sender: "user" ,
              id: crypto.randomUUID()
            })
            console.log(chatMessages)
          }
          return (
            <>
            <button onClick={sendMessage}>Send message</button>
            {chatMessages.map((chatMessage, index) =>{
              return (
                <ChatMessage
                key={index}
                message={chatMessage.message}
                sender={chatMessage.sender}
                />
              );
            })}
            </>
          );
        }
        
        function App() {
          return (
            <>
              <ChatInput />
              <ChatMessages />
            </>
          );
        }
        
          
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />); 
    </script>
  </body>
</html>
