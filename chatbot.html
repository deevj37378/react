<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>
    <script src="react-basics.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        function ChatInput() {
          return (
            <>
            <input placeholder="Send a message to ChatBot" size="30"></input>
            <button>Send</button>
            </>
          );
        }
        function ChatMessage(props) {
          // const message = props.message, both are the same thing
          const { message,sender } = props;

          // if (sender === "user") {
          //   return (
          //     <div>
          //       {message}
          //       <img src="user-pic.png" width="50"/>
          //     </div>
          //   );
          // } else if (sender === "robot") {
          //   return (
          //     <div>
          //       <img src="robot-pic.png" width="50"/>
          //       {message}
          //     </div>
          //   );
          // }
            return (
              <div>
              {sender === 'user' && <img src="user-pic.png" width="50"/>}
              {message}
              {sender === 'robot' && <img src="robot-pic.png" width="50"/>}
              </div>
            );
          

          // return (
          //   <div>
          //   {message}
          //   <img src="user-pic.png" width="50" />
          //   </div>
          // )
          // ;
        }
        function App() {
          const chatMessages = [
            { message: "Hello chatbot", sender: "user" },
            { message: "Hello! How can I help you?", sender: "robot" },
            { message: "today's date", sender: "user" },
            { message: "Today is October 11", sender: "robot" }
          ];

          return (
            <>
              {chatMessages.map((chatMessage, index) => (
                <ChatMessage
                  key={index}
                  message={chatMessage.message}
                  sender={chatMessage.sender}
                />
              ))}
              <ChatInput />
            </>
          );
        }
        
          
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />); 
    </script>
  </body>
</html>
