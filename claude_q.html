        function LikeButton( {title, startingLike}) {
            const [liked, setLiked] = React.useState(false)

            function toggleLikes() {
                setLiked(!liked)
            }
            const likeCount = startingLike + (liked ? 1 : 0)

            return (
                <>
                <button onClick={toggleLikes}>{liked ? "liked" : "like"}</button>
                <p>{likeCount}</p>
                </>
            )
        }
        function App() {
            return <LikeButton title="hello" startingLike={10}/>
        }

    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(<App />);
